<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Location Viewer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="./css/style.css">

</head>

<body>

<header>
👀 LIVE LOCATION VIEWER
</header>

<div class="container">

<label>Tracking ID</label>

<input
id="deviceId"
type="text"
value="REYAD001"
placeholder="Example : REYAD001">

<button
id="viewButton"
onclick="startViewer()"
disabled>

⏳ Connecting...

</button>

</div>

<div id="map"></div>

<div class="status" id="status">
🔄 Connecting Firebase...
</div>

<div class="info">
Latitude :
<span id="lat">---</span>
</div>

<div class="info">
Longitude :
<span id="lng">---</span>
</div>

<div class="info">
Accuracy :
<span id="accuracy">---</span>
</div>

<div class="info">
Last Update :
<span id="time">---</span>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module" src="./js/viewer.js"></script>

</body>

</html>
