<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Live Location Viewer</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

header {
    background: #111827;
    color: white;
    padding: 18px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
}

.container {
    padding: 15px;
    background: white;
}

input {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    box-sizing: border-box;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #059669;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:disabled {
    background: #999;
}

#map {
    height: 60vh;
    width: 100%;
}

.status {
    padding: 15px;
    background: white;
    font-weight: bold;
}

.info {
    padding: 5px 15px;
    background: white;
}

</style>

</head>


<body>


<header>

👀 LIVE LOCATION VIEWER

</header>


<div class="container">


<label>Tracking ID</label>


<input

id="deviceId"

value="REYAD001"

placeholder="Example: REYAD001">


<button

id="viewButton"

onclick="startViewer()"

disabled>

⏳ Connecting...

</button>


</div>


<div id="map"></div>


<div class="status"
id="status">

🔄 Connecting to Firebase...

</div>


<div class="info">

Latitude:

<span id="lat">---</span>

</div>


<div class="info">

Longitude:

<span id="lng">---</span>

</div>


<div class="info">

Accuracy:

<span id="accuracy">---</span>

</div>


<div class="info">

Last Update:

<span id="time">---</span>

</div>



<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>



<script type="module">


import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getDatabase,

ref,

onValue

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



import {

getAuth,

signInAnonymously

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



const firebaseConfig = {


apiKey:

"AIzaSyC_iYK2KfWtLqDy2rcGeyWR6M1RfGosGpw",


authDomain:

"my-mobile-live-location.firebaseapp.com",


databaseURL:

"https://my-mobile-live-location-default-rtdb.firebaseio.com",


projectId:

"my-mobile-live-location",


storageBucket:

"my-mobile-live-location.firebasestorage.app",


messagingSenderId:

"1001346063788",


appId:

"1:1001346063788:web:7c4f0d45b03bf2d6b86e09",


measurementId:

"G-E40PJX034X"

};



const app =

initializeApp(firebaseConfig);



const database =

getDatabase(app);



const auth =

getAuth(app);



/* ===========================
   NORMAL MAP
=========================== */


const normalMap =

L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

{

maxZoom: 19,

attribution:
"© OpenStreetMap"

}

);



/* ===========================
   SATELLITE MAP
=========================== */


const satelliteMap =

L.tileLayer(

"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",

{

maxZoom: 19,

attribution:
"Tiles © Esri"

}

);



/* ===========================
   MAP
=========================== */


const map =

L.map("map", {

center:
[23.8103, 90.4125],

zoom:
13,

layers:
[normalMap]

});



/* ===========================
   MAP SWITCHER
=========================== */


const baseMaps = {

"🗺️ Normal":
normalMap,

"🛰️ Satellite":
satelliteMap

};



L.control.layers(

baseMaps

).addTo(map);



let marker = null;

let authenticated = false;



/* ===========================
   AUTH
=========================== */


signInAnonymously(auth)

.then(() => {


authenticated = true;


document.getElementById(

"viewButton"

).disabled = false;


document.getElementById(

"viewButton"

).innerText =

"👀 VIEW LIVE LOCATION";


document.getElementById(

"status"

).innerText =

"🟢 Ready";

})


.catch((error) => {


console.error(error);


document.getElementById(

"status"

).innerText =

"❌ Firebase authentication failed";

});



/* ===========================
   VIEWER
=========================== */


window.startViewer = function() {


if (!authenticated) {


alert(

"Please wait for Firebase connection."

);


return;

}



const deviceId =

document.getElementById(

"deviceId"

).value.trim();



if (!deviceId) {


alert(

"Enter a Tracking ID."

);


return;

}



document.getElementById(

"viewButton"

).disabled = true;



document.getElementById(

"viewButton"

).innerText =

"🟢 WATCHING LIVE";



document.getElementById(

"status"

).innerText =

"🔄 Waiting for location...";



const locationRef =

ref(

database,

"locations/" + deviceId

);



onValue(

locationRef,


(snapshot) => {


const data =

snapshot.val();



if (!data) {


document.getElementById(

"status"

).innerText =

"⚠️ No location found for this ID";


return;

}



const latitude =

Number(data.latitude);



const longitude =

Number(data.longitude);



const accuracy =

Number(data.accuracy);



const timestamp =

Number(data.timestamp);



document.getElementById(

"status"

).innerText =

"🟢 LIVE LOCATION";



document.getElementById(

"lat"

).innerText =

latitude.toFixed(6);



document.getElementById(

"lng"

).innerText =

longitude.toFixed(6);



document.getElementById(

"accuracy"

).innerText =

Math.round(accuracy) +

" meters";



document.getElementById(

"time"

).innerText =

new Date(timestamp)

.toLocaleTimeString();



/* ===========================
   MARKER
=========================== */


if (marker) {


marker.setLatLng([

latitude,

longitude

]);


}

else {


marker =

L.marker([

latitude,

longitude

])

.addTo(map);

}


/* ===========================
   CENTER MAP
=========================== */


map.setView(

[

latitude,

longitude

],

17

);

},


(error) => {


console.error(error);


document.getElementById(

"status"

).innerText =

"❌ Unable to read location";

}

);

};


</script>


</body>

</html>
