<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Live Location Tracker</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      background: #111827;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .controls {
      background: white;
      padding: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button.viewer {
      background: #059669;
    }

    #map {
      width: 100%;
      height: 65vh;
    }

    .panel {
      background: white;
      padding: 15px;
    }

    .status {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .info {
      margin: 6px 0;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<header>
  📍 Live Location Tracker
</header>

<div class="controls">

  <button onclick="startTracking()">
    📱 START TRACKING
  </button>

  <button class="viewer" onclick="startViewer()">
    👀 VIEW LIVE LOCATION
  </button>

</div>

<div id="map"></div>

<div class="panel">

  <div class="status" id="status">
    🔴 Not Started
  </div>

  <div class="info">
    Latitude:
    <span id="lat">---</span>
  </div>

  <div class="info">
    Longitude:
    <span id="lng">---</span>
  </div>

  <div class="info">
    Accuracy:
    <span id="accuracy">---</span>
  </div>

  <div class="info">
    Last Update:
    <span id="lastUpdate">---</span>
  </div>

</div>


<script type="module">

  import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getDatabase,
    ref,
    set,
    onValue
  }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


  // ==============================
  // FIREBASE CONFIG
  // ==============================

  const firebaseConfig = {

    apiKey:
      "AIzaSyC_iYK2KfWtLqDy2rcGeyWR6M1RfGosGpw",

    authDomain:
      "my-mobile-live-location.firebaseapp.com",

    databaseURL:
      "https://my-mobile-live-location-default-rtdb.firebaseio.com",

    projectId:
      "my-mobile-live-location",

    storageBucket:
      "my-mobile-live-location.firebasestorage.app",

    messagingSenderId:
      "1001346063788",

    appId:
      "1:1001346063788:web:7c4f0d45b03bf2d6b86e09",

    measurementId:
      "G-E40PJX034X"
  };


  const app = initializeApp(firebaseConfig);

  const database = getDatabase(app);


  // ==============================
  // MAP
  // ==============================

  const map =
    L.map("map").setView([23.8103, 90.4125], 13);


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution: "© OpenStreetMap"
    }
  ).addTo(map);


  let marker = null;

  let trackingStarted = false;


  // ==============================
  // TRACKER
  // ==============================

  window.startTracking = function () {

    if (!navigator.geolocation) {

      alert(
        "GPS is not supported by this browser."
      );

      return;
    }


    trackingStarted = true;

    document.getElementById("status").innerText =
      "🟢 TRACKING LIVE";


    navigator.geolocation.watchPosition(

      async function(position) {

        const latitude =
          position.coords.latitude;

        const longitude =
          position.coords.longitude;

        const accuracy =
          position.coords.accuracy;


        document.getElementById("lat").innerText =
          latitude.toFixed(6);

        document.getElementById("lng").innerText =
          longitude.toFixed(6);

        document.getElementById("accuracy").innerText =
          Math.round(accuracy) + " meters";

        document.getElementById("lastUpdate").innerText =
          new Date().toLocaleTimeString();


        // Marker

        if (marker) {

          marker.setLatLng([
            latitude,
            longitude
          ]);

        } else {

          marker =
            L.marker([
              latitude,
              longitude
            ])
            .addTo(map);

        }


        map.setView(
          [latitude, longitude],
          17
        );


        // Firebase

        await set(

          ref(
            database,
            "locations/device1"
          ),

          {

            latitude:
              latitude,

            longitude:
              longitude,

            accuracy:
              accuracy,

            timestamp:
              Date.now()

          }

        );

      },


      function(error) {

        document.getElementById("status").innerText =
          "❌ GPS Error: " + error.message;

      },


      {

        enableHighAccuracy: true,

        maximumAge: 0,

        timeout: 10000

      }

    );

  };


  // ==============================
  // VIEWER
  // ==============================

  window.startViewer = function () {

    document.getElementById("status").innerText =
      "👀 WATCHING LIVE LOCATION";


    const locationRef =
      ref(
        database,
        "locations/device1"
      );


    onValue(

      locationRef,

      function(snapshot) {

        const data =
          snapshot.val();


        if (!data) {

          document.getElementById("status").innerText =
            "⚠️ No location data yet";

          return;
        }


        const latitude =
          data.latitude;

        const longitude =
          data.longitude;


        document.getElementById("lat").innerText =
          Number(latitude).toFixed(6);

        document.getElementById("lng").innerText =
          Number(longitude).toFixed(6);

        document.getElementById("accuracy").innerText =
          Math.round(data.accuracy) +
          " meters";


        document.getElementById("lastUpdate").innerText =
          new Date(
            data.timestamp
          ).toLocaleTimeString();


        // Viewer marker

        if (marker) {

          marker.setLatLng([
            latitude,
            longitude
          ]);

        } else {

          marker =
            L.marker([
              latitude,
              longitude
            ])
            .addTo(map);

        }


        map.setView(
          [latitude, longitude],
          17
        );

      }

    );

  };

</script>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

</body>
</html>
