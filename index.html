<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Live Location Tracker</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      background: #111827;
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .controls {
      background: white;
      padding: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button.viewer {
      background: #059669;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    #map {
      width: 100%;
      height: 65vh;
    }

    .panel {
      background: white;
      padding: 15px;
    }

    .status {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .info {
      margin: 7px 0;
      color: #444;
    }

  </style>

</head>


<body>

<header>
  📍 Live Location Tracker
</header>


<div class="controls">

  <button
    id="trackingButton"
    onclick="startTracking()"
    disabled
  >
    ⏳ Connecting...
  </button>

  <button
    id="viewerButton"
    class="viewer"
    onclick="startViewer()"
    disabled
  >
    ⏳ Connecting...
  </button>

</div>


<div id="map"></div>


<div class="panel">

  <div
    class="status"
    id="status"
  >
    🔄 Connecting to Firebase...
  </div>

  <div class="info">
    Latitude:
    <span id="lat">---</span>
  </div>

  <div class="info">
    Longitude:
    <span id="lng">---</span>
  </div>

  <div class="info">
    Accuracy:
    <span id="accuracy">---</span>
  </div>

  <div class="info">
    Last Update:
    <span id="lastUpdate">---</span>
  </div>

</div>


<!-- Leaflet JS -->

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<!-- Firebase -->

<script type="module">

  import {
    initializeApp
  }
  from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


  import {
    getDatabase,
    ref,
    set,
    onValue
  }
  from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


  import {
    getAuth,
    signInAnonymously
  }
  from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


  // =====================================
  // FIREBASE CONFIG
  // =====================================

  const firebaseConfig = {

    apiKey:
      "AIzaSyC_iYK2KfWtLqDy2rcGeyWR6M1RfGosGpw",

    authDomain:
      "my-mobile-live-location.firebaseapp.com",

    databaseURL:
      "https://my-mobile-live-location-default-rtdb.firebaseio.com",

    projectId:
      "my-mobile-live-location",

    storageBucket:
      "my-mobile-live-location.firebasestorage.app",

    messagingSenderId:
      "1001346063788",

    appId:
      "1:1001346063788:web:7c4f0d45b03bf2d6b86e09",

    measurementId:
      "G-E40PJX034X"

  };


  // =====================================
  // INITIALIZE FIREBASE
  // =====================================

  const app =
    initializeApp(firebaseConfig);


  const database =
    getDatabase(app);


  const auth =
    getAuth(app);


  // =====================================
  // MAP
  // =====================================

  const map =
    L.map("map").setView(
      [23.8103, 90.4125],
      13
    );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution:
        "© OpenStreetMap"
    }
  ).addTo(map);


  let marker = null;

  let userAuthenticated = false;


  // =====================================
  // AUTHENTICATION
  // =====================================

  signInAnonymously(auth)

    .then(() => {

      userAuthenticated = true;


      document.getElementById(
        "trackingButton"
      ).disabled = false;


      document.getElementById(
        "viewerButton"
      ).disabled = false;


      document.getElementById(
        "trackingButton"
      ).innerText =
        "📱 START TRACKING";


      document.getElementById(
        "viewerButton"
      ).innerText =
        "👀 VIEW LIVE LOCATION";


      document.getElementById(
        "status"
      ).innerText =
        "🟢 Connected to Firebase";

    })


    .catch((error) => {

      console.error(
        "Authentication Error:",
        error
      );


      document.getElementById(
        "status"
      ).innerText =
        "❌ Firebase Authentication Failed";

    });


  // =====================================
  // START TRACKING
  // =====================================

  window.startTracking = function () {


    if (!userAuthenticated) {

      alert(
        "Please wait for Firebase connection."
      );

      return;

    }


    if (!navigator.geolocation) {

      alert(
        "GPS is not supported by this browser."
      );

      return;

    }


    document.getElementById(
      "status"
    ).innerText =
      "🟢 TRACKING LIVE";


    navigator.geolocation.watchPosition(


      async function(position) {


        const latitude =
          position.coords.latitude;


        const longitude =
          position.coords.longitude;


        const accuracy =
          position.coords.accuracy;


        const timestamp =
          Date.now();


        // =================================
        // UPDATE SCREEN
        // =================================

        document.getElementById(
          "lat"
        ).innerText =
          latitude.toFixed(6);


        document.getElementById(
          "lng"
        ).innerText =
          longitude.toFixed(6);


        document.getElementById(
          "accuracy"
        ).innerText =
          Math.round(
            accuracy
          ) + " meters";


        document.getElementById(
          "lastUpdate"
        ).innerText =
          new Date(
            timestamp
          ).toLocaleTimeString();


        // =================================
        // UPDATE MAP MARKER
        // =================================

        if (marker) {

          marker.setLatLng([
            latitude,
            longitude
          ]);

        }

        else {

          marker =
            L.marker([
              latitude,
              longitude
            ])
            .addTo(map);

        }


        map.setView(
          [
            latitude,
            longitude
          ],
          17
        );


        // =================================
        // SEND TO FIREBASE
        // =================================

        try {

          await set(

            ref(
              database,
              "locations/device1"
            ),

            {

              latitude:
                latitude,

              longitude:
                longitude,

              accuracy:
                accuracy,

              timestamp:
                timestamp

            }

          );

        }

        catch (error) {

          console.error(
            "Firebase Write Error:",
            error
          );


          document.getElementById(
            "status"
          ).innerText =
            "❌ Unable to send location";

        }

      },


      function(error) {

        document.getElementById(
          "status"
        ).innerText =
          "❌ GPS Error: " +
          error.message;

      },


      {

        enableHighAccuracy:
          true,

        maximumAge:
          0,

        timeout:
          10000

      }

    );

  };


  // =====================================
  // VIEW LIVE LOCATION
  // =====================================

  window.startViewer = function() {


    if (!userAuthenticated) {

      alert(
        "Please wait for Firebase connection."
      );

      return;

    }


    document.getElementById(
      "status"
    ).innerText =
      "👀 WATCHING LIVE LOCATION";


    const locationRef =
      ref(
        database,
        "locations/device1"
      );


    onValue(

      locationRef,


      function(snapshot) {


        const data =
          snapshot.val();


        if (!data) {

          document.getElementById(
            "status"
          ).innerText =
            "⚠️ No location data yet";

          return;

        }


        const latitude =
          Number(
            data.latitude
          );


        const longitude =
          Number(
            data.longitude
          );


        const accuracy =
          Number(
            data.accuracy
          );


        const timestamp =
          Number(
            data.timestamp
          );


        // =================================
        // UPDATE INFORMATION
        // =================================

        document.getElementById(
          "status"
        ).innerText =
          "🟢 LIVE LOCATION";


        document.getElementById(
          "lat"
        ).innerText =
          latitude.toFixed(6);


        document.getElementById(
          "lng"
        ).innerText =
          longitude.toFixed(6);


        document.getElementById(
          "accuracy"
        ).innerText =
          Math.round(
            accuracy
          ) + " meters";


        document.getElementById(
          "lastUpdate"
        ).innerText =
          new Date(
            timestamp
          ).toLocaleTimeString();


        // =================================
        // UPDATE VIEWER MARKER
        // =================================

        if (marker) {

          marker.setLatLng([
            latitude,
            longitude
          ]);

        }

        else {

          marker =
            L.marker([
              latitude,
              longitude
            ])
            .addTo(map);

        }


        map.setView(
          [
            latitude,
            longitude
          ],
          17
        );

      },

      function(error) {

        console.error(
          "Firebase Read Error:",
          error
        );


        document.getElementById(
          "status"
        ).innerText =
          "❌ Unable to read location";

      }

    );

  };


</script>

</body>
</html>
